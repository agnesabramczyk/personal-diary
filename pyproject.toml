[project]
name = "personal-diary"
version = "1.0.0"
description = "Personal diary REST API with FastAPI and Google Cloud Platform"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Agnes" }
]

dependencies = [
    # FastAPI Web Framework
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "python-multipart==0.0.18",

    # Google Cloud Platform
    "google-cloud-firestore==2.23.0",
    "google-cloud-storage==3.8.0",

    # Image Processing
    "pillow==12.1.0",

    # Rate Limiting
    "slowapi==0.1.9",

    # Data Validation
    "pydantic==2.12.5",
    "pydantic-settings==2.7.0",

    # Configuration Management
    "python-dotenv==1.2.1",

    # HTTP Client (for healthcheck)
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    # Development Tools
    "ruff==0.14.14",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "httpx==0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
